  <div id="left-panel-stack" class="dl-left-stack">
  <!-- Data Layer Toggle Panel -->
  <div id="data-panel" class="panel-collapsible collapsed active dl-nav-card" data-panel-id="data-panel">
    <div class="panel-glow"></div>
    <div class="data-panel-inner dl-nav-inner">
      <div class="panel-header dl-nav-header">
        <div class="dl-nav-title-group">
          <span class="panel-title dl-nav-title">OPERATIONAL DATA</span>
          <span class="dl-nav-subtitle">Live Layers & Feeds</span>
        </div>
        <button class="panel-collapse-btn dl-collapse-btn" data-collapse-target="data-panel" title="Toggle panel" aria-label="Toggle panel">−</button>
      </div>
      <div id="data-toggles" class="data-toggle-list dl-nav-list"></div>
    </div>
  </div>

  <!-- Tools Panel: Evidence & Review Queue -->
  <div id="tools-panel" class="panel-collapsible collapsed dl-nav-card" data-panel-id="tools-panel">
    <div class="panel-glow"></div>
    <div class="tools-panel-inner dl-nav-inner">
      <div class="panel-header dl-nav-header">
        <div class="dl-nav-title-group">
          <span class="panel-title dl-nav-title">DECISION TOOLS</span>
          <span class="dl-nav-subtitle">Intelligence Queue & Evidence</span>
        </div>
        <button class="panel-collapse-btn dl-collapse-btn" data-collapse-target="tools-panel" title="Toggle panel" aria-label="Toggle panel">+</button>
      </div>
      <div class="tools-controls dl-tools-list">
        <button id="open-review-queue-btn" class="dl-tool-card" type="button">
          <span class="dl-tool-icon">🛡️</span>
          <div class="dl-tool-info">
            <span class="dl-tool-title">HUMAN REVIEW QUEUE</span>
            <span class="dl-tool-desc">Prioritized triage & audit verification</span>
          </div>
          <span class="dl-tool-arrow">→</span>
        </button>
        <button id="open-evidence-btn" class="dl-tool-card" type="button">
          <span class="dl-tool-icon">📋</span>
          <div class="dl-tool-info">
            <span class="dl-tool-title">MULTIMODAL EVIDENCE</span>
            <span class="dl-tool-desc">Corroborated witness & sensor cards</span>
          </div>
          <span class="dl-tool-arrow">→</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Scene Director Panel -->
  <div id="scene-panel" class="panel-collapsible collapsed" data-panel-id="scene-panel">
    <div class="panel-glow"></div>
    <div class="scene-panel-inner">
      <div class="panel-header">
        <span class="panel-title">SCENES</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="scene-panel" title="Collapse panel">+</button>
      </div>
      <div class="scene-controls">
        <select id="scene-select" aria-label="Scene recipe"></select>
        <button id="scene-new-btn" class="scene-btn">NEW</button>
        <button id="scene-delete-btn" class="scene-btn scene-btn-danger">DEL</button>
      </div>
      <div class="scene-controls">
        <button id="scene-capture-btn" class="scene-btn">CAPTURE SHOT</button>
        <button id="scene-update-shot-btn" class="scene-btn">UPDATE SHOT</button>
      </div>
      <div id="scene-shot-list" class="scene-shot-list"></div>
      <div class="scene-controls">
        <button id="scene-start-btn" class="scene-btn">START</button>
        <button id="scene-stop-btn" class="scene-btn scene-btn-danger">STOP</button>
        <button id="scene-next-btn" class="scene-btn">NEXT</button>
      </div>
      <div class="scene-controls">
        <button id="scene-export-btn" class="scene-btn">EXPORT PRESETS</button>
        <button id="scene-import-btn" class="scene-btn">IMPORT</button>
        <button id="scene-download-btn" class="scene-btn">RUN LOG</button>
        <input type="file" id="scene-import-file" accept="application/json,.json" hidden />
      </div>
      <div class="scene-progress">
        <div id="scene-progress-fill">0%</div>
      </div>
      <div id="scene-status">Ready</div>
    </div>
  </div>

  </div>
